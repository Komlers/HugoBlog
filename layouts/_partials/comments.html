{{- if .Site.Config.Services.Disqus.Shortname -}} 
{{ template "_internal/disqus.html" . }}
{{- else if .Site.Params.utterances.repo -}}
<div id="comment-btn-wrap">
  <button id="comment-btn" type="button" onclick="loadUtterances()">
    {{- with .Site.Params.utterances.buttonText }}{{ . }}{{ else }}加载评论{{ end -}}
  </button>
</div>
<div id="utterances-container"></div>
<script>
  function loadUtterances() {
    var wrap = document.getElementById('comment-btn-wrap');
    if (wrap) wrap.style.display = 'none';
    var container = document.getElementById('utterances-container');
    if (!container || container.getAttribute('data-loaded')) return;
    container.setAttribute('data-loaded', 'true');
    var s = document.createElement('script');
    s.src = 'https://utteranc.es/client.js';
    s.setAttribute('repo', '{{ .Site.Params.utterances.repo }}');
    s.setAttribute('issue-term', '{{ with .Site.Params.utterances.issueTerm }}{{ . }}{{ else }}pathname{{ end }}');
    s.setAttribute('theme', '{{ with .Site.Params.utterances.theme }}{{ . }}{{ else }}github-light{{ end }}');
    s.setAttribute('crossorigin', 'anonymous');
    s.async = true;
    container.appendChild(s);
  }
</script>
{{- end -}}
