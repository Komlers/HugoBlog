baseURL = "https://blog.danevan.top/"
theme = "hermit-v2"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

title = "我的博客"
copyright = "Evan"

pygmentsCodefences = true
pygmentsUseClasses = true

rssLimit = 10

[params.author]
  name = "Evan"
  about = "about.md"

[taxonomies]
  tag = "tags"

[params]
  description = "一个使用 Hugo + Hermit-V2 搭建的个人博客"
  themeColor = "#494f5c"
  accentColor = "#018472"

  homeSubtitle = "记录与分享"
  footerCopyright = "Evan"
  justifyContent = false
  code_copy_button = true
  homeSubtitlePrinter = true
  scrollToTop = true
  global_mathjax = false
  shareSocial = true

  [params.pages]
    LastmodOpen = '['
    LastmodClose = ']'
    readTimeSeparator = "… ⏱ 阅读时长:"
    lastUpdatedOn = "最后更新于: "
    relatedPosts = true

  [params.gallery]
    enable = true
    width = '300'
    layout = "grid"

  [params.dateform]
    CopyrightDate = "2006"
    LongDate = "2006年1月2日"
    ShortDate = "1月2日"
    NumDateShort = "2006-01-02"
    NumDateLong = "2006-01-02 15:04 -0700"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/YOUR_GITHUB_USERNAME"

[menu]
  [[menu.main]]
    name = "文章"
    url = "posts/"
    weight = 10

  [[menu.main]]
    name = "关于"
    url = "about/"
    weight = 20
